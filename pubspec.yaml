name: x7
description: Open dashboard & control center for Talaria (Greenway BMS + EBMX X-9000) over Bluetooth.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # BLE central supporting multiple simultaneous connections (BMS + controller)
  flutter_blue_plus: ^1.32.0
  # runtime permission requests (Bluetooth/location on Android)
  permission_handler: ^11.3.0
  # persisted user settings (units, keep-screen-on, chosen devices)
  shared_preferences: ^2.2.3
  # keep the screen awake (dashboard use on the bike)
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # fake time for the launch-assist state-machine tests
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
