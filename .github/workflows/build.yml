name: build

# Builds x7 entirely on GitHub runners -- no local machine is involved.
# Every push/PR produces a universal release APK as a workflow artifact; pushing a
# v* tag additionally cuts a GitHub Release with the APK attached (Release assets are
# publicly downloadable, workflow artifacts are not).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the versions the project is known-good on, so CI can't silently drift.
  FLUTTER_VERSION: '3.47.1'
  # Must be 17: android/app/build.gradle.kts pins both compileOptions and the Kotlin
  # jvmTarget to VERSION_17.
  JAVA_VERSION: '17'

jobs:
  # Deliberately NOT a dependency of `build` -- neither of these has ever been run
  # against this repo, and a lint finding should not stop an APK from being produced.
  # Once both are green, add `needs: [checks]` to `build` to make them a real gate.
  checks:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # test/widget_test.dart is pure Dart (CRC-16, VESC framing, cmd-113 injector
      # packets, SET_DUTY encoding, BMS read framing) -- no BLE or hardware needed.
      # Runs even when analyze fails: a lint finding should not hide a test result.
      - run: flutter test
        if: '!cancelled()'

  build:
    name: universal release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # only needed by the release step
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Useful on a first run: reports the resolved Android SDK and toolchain.
      - run: flutter doctor -v

      - run: flutter pub get

      - name: Derive version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "name_arg=--build-name=$version" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml | head -1)
            echo "name_arg=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No --split-per-abi: the default is a universal fat APK carrying arm64-v8a,
      # armeabi-v7a and x86_64, so one file installs on essentially any Android device.
      # Signed with the runner's auto-generated debug key -- see the release notes below.
      - name: Build universal release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            ${{ steps.ver.outputs.name_arg }}

      - name: Name the APK
        id: apk
        run: |
          name="x7-${{ steps.ver.outputs.version }}-build${{ github.run_number }}-$(git rev-parse --short HEAD).apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          ls -lh "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: x7-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Universal APK (arm64-v8a + armeabi-v7a + x86_64) -- one file, installs on
            essentially any Android device.

            **Installing:** you'll need to allow installing from unknown sources, and
            Android may warn about the developer being unrecognised.

            **Upgrading:** these builds are signed with the build runner's throwaway debug
            key, which differs between builds. Android only allows an in-place update when
            the signature matches, so to install a newer x7 over an older one you must
            uninstall the old one first (Settings -> Apps -> x7 -> Uninstall, or
            `adb uninstall com.svyourmom.x7`). This resets the app's saved settings.
          fail_on_unmatched_files: true
